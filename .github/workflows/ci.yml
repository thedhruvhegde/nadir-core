name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dashcam,dev]"
      - name: Test
        run: pytest -q
      - name: Smoke dashcam cli
        run: nadir-dashcam analyze --source synthetic --yaw-drift 0.8 --store /tmp/ci_dash.jsonl
