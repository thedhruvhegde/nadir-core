[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "nadir-core"
dynamic = ["version"]
description = "Open-source ADAS sensor drift scoring — shadow-mode residuals, Pulse tiers, synthetic telemetry."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "NADIR", email = "founders@nadirai.net" }]
keywords = [
    "adas",
    "sensor-drift",
    "calibration",
    "fleet",
    "telemetry",
    "open-source",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
nadir-core-score = "nadir_core.cli:main"
nadir-core-generate = "nadir_core.synthetic.cli:main"

[project.urls]
Homepage = "https://nadirai.net"
Documentation = "https://github.com/thedhruvhegde/nadir-core#readme"
Repository = "https://github.com/thedhruvhegde/nadir-core"
Issues = "https://github.com/thedhruvhegde/nadir-core/issues"
Commercial = "https://nadirai.net/technology/validation"

[tool.hatch.version]
path = "src/nadir_core/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nadir_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
