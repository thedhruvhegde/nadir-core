[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "nadir-core"
dynamic = ["version"]
description = "Open-source ADAS sensor drift scoring — shadow-mode residuals, Pulse tiers, synthetic telemetry."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "NADIR", email = "founders@nadirai.net" }]
keywords = [
    "adas",
    "sensor-drift",
    "calibration",
    "fleet",
    "telemetry",
    "open-source",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24.0",
